version: '3.8'

services:
  plants-db:
    image: postgres:16-alpine
    container_name: plants-db
    environment:
      POSTGRES_USER: plants_user
      POSTGRES_PASSWORD: plants_password
      POSTGRES_DB: plants_db
    ports:
      - "5432:5432"
    volumes:
      - plants_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plants_user -d plants_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  plants_pgdata: